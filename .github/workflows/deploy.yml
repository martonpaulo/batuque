name: Deploy

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only a validated push to this repository's main deploys: a fork's pull request from its own
    # `main` also matches `branches: [main]`, and must never reach Pages.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip a commit that is no longer the tip of main
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit is on main; its own run deploys it."; fi
      # A manual deploy has no Validate run behind it, so it runs the same gate first (#9).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: pnpm
      - name: Validate before a manual deploy
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          pnpm install --frozen-lockfile
          node tools/install-browser.mjs
          pnpm validate
      - name: Build the site (only what the browser loads, one page per rhythm path, every asset at the deployed commit, #35)
        if: steps.tip.outputs.current == 'true'
        run: |
          node tools/build-site.mjs _site "${{ github.event.workflow_run.head_sha || github.sha }}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.tip.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.tip.outputs.current == 'true'
      # GitHub's list of a run's artifacts can lag the upload: on 2026-11-28 three of six runs failed
      # here on «No artifacts named "github-pages"», and each run's artifact was listed afterwards.
      # So a failed try is made again after a wait, twice at most, and only the last try's failure
      # fails the job (#70).
      - id: deployment
        if: steps.tip.outputs.current == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: second
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before the third try
        if: steps.second.outcome == 'failure'
        run: sleep 90
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read the live site back
        if: steps.tip.outputs.current == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
        run: python3 scripts/live_build_check.py "${PAGE_URL}build.txt" "${{ github.event.workflow_run.head_sha || github.sha }}"

  # A deployment that failed leaves a record outside the Actions page: one open issue, «Deploy red on
  # main at <commit>», which a backlog run takes first, and the next deployment that passes closes it
  # (#70). It is a job of its own, so the job that publishes holds no token that writes issues, and it
  # runs only for a commit the deploy job took: a failure, or the tip of main.
  record:
    needs: deploy
    if: ${{ !cancelled() && (needs.deploy.result == 'failure' || needs.deploy.outputs.current == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the issue of a failed deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '{"deploy": {"result": "%s"}}' "$RESULT" | python3 scripts/upstream_check.py alert \
            --repo "$GITHUB_REPOSITORY" --workflow Deploy --run-url "$RUN_URL" --results - --sha "$SHA"
